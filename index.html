<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحضير الدروس بالذكاء الاصطناعي - IPA</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 0; }
        
        /* شاشة تسجيل الدخول */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95); display: flex;
            justify-content: center; align-items: center; z-index: 9999;
        }
        .login-box {
            background: white; padding: 40px; border-radius: 12px;
            width: 90%; max-width: 400px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .login-box h2 { color: #1e293b; margin-bottom: 8px; }
        .login-box p { color: #64748b; font-size: 14px; margin-bottom: 24px; }
        .login-box input {
            width: 100%; padding: 12px; border: 1px solid #cbd5e1;
            border-radius: 6px; font-size: 15px; margin-bottom: 12px; outline: none;
        }
        .login-box button {
            width: 100%; padding: 12px; background: #2563eb; color: white;
            border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer;
        }
        .login-box button:hover { background: #1d4ed8; }
        .error-msg { color: #ef4444; font-size: 13px; margin-top: 10px; display: none; }

        /* المحتوى الرئيسي */
        #main-content { display: none; padding: 20px; max-width: 900px; margin: 0 auto; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #334155; }
        input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .btn-generate { background: #10b981; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        .btn-generate:hover { background: #059669; }
        #output { margin-top: 25px; padding: 20px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; white-space: pre-wrap; line-height: 1.6; }
    </style>
</head>
<body>

    <!-- شاشة التحقق من البريد الإلكتروني -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>تسجيل الدخول</h2>
            <p>مخصص لأعضاء IPA فقط</p>
            <input type="email" id="user-email" placeholder="example@ipa.edu.jo" required>
            <button onclick="validateLogin()">دخول</button>
            <div id="login-error" class="error-msg">عذراً، الدخول متاح فقط للإيميلات التي تتبع المجموع الكلي @ipa.edu.jo</div>
        </div>
    </div>

    <!-- المحتوى الرئيسي للبرنامج -->
    <div id="main-content">
        <div class="container">
            <h2>نظام تحضير الدروس التلقائي (IPA)</h2>
            <hr><br>
            <div class="form-group">
                <label>المادة والصف:</label>
                <input type="text" id="subject" placeholder="مثال: الرياضيات - الصف السادس">
            </div>
            <div class="form-group">
                <label>عنوان الدرس:</label>
                <input type="text" id="topic" placeholder="مثال: الاستهلاك الرشيد">
            </div>
            <div class="form-group">
                <label>ملاحظات أو أهداف خاصة (اختياري):</label>
                <textarea id="notes" rows="3" placeholder="أضف أي تفاصيل تود تضمينها في التحضير..."></textarea>
            </div>
            <button class="btn-generate" onclick="generateLesson()">توليد التحضير الآن</button>

            <div id="output">سيظهر تحضير الدرس هنا بعد الضغط على زر التوليد...</div>
        </div>
    </div>

    <script>
        // تثبيت مفتاح API الخاص بـ Gemini هنا ليعمل تلقائياً
        const GEMINI_API_KEY = "ضع_مفتاح_API_الخاص_بك_هنا";

        function validateLogin() {
            const emailInput = document.getElementById('user-email').value.trim().toLowerCase();
            const errorMsg = document.getElementById('login-error');

            if (emailInput.endsWith('@ipa.edu.jo')) {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            } else {
                errorMsg.style.display = 'block';
            }
        }

        async function generateLesson() {
            const subject = document.getElementById('subject').value;
            const topic = document.getElementById('topic').value;
            const notes = document.getElementById('notes').value;
            const outputDiv = document.getElementById('output');

            if (!subject || !topic) {
                alert('يرجى كتابة المادة وعنوان الدرس');
                return;
            }

            outputDiv.innerText = "جاري كتابة التحضير بالذكاء الاصطناعي...";

            const promptText = `قم بتحضير درس متكامل للمادة: ${subject}، بعنوان: ${topic}. الملاحظات: ${notes}. قم بتضمين الأهداف السلوكية، التمهيد، الإجراءات، والتقويم التكويني.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    outputDiv.innerText = data.candidates[0].content.parts[0].text;
                } else {
                    outputDiv.innerText = "حدث خطأ أثناء التوليد، يرجى التأكد من صحة مفتاح Gemini API.";
                }
            } catch (err) {
                outputDiv.innerText = "خطأ في الاتصال: " + err.message;
            }
        }
    </script>
</body>
</html>
