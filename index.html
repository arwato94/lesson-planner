<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مساعد تحضير الدروس الذكي - أكاديمية الرواد الدولية</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --primary:#0f6e5c;
    --primary-dark:#0a5346;
    --accent:#c8963e;
    --bg:#f5f7f6;
    --card:#ffffff;
    --border:#dfe6e3;
    --text:#22302c;
    --muted:#6b7a75;
    --danger:#b3413b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI","Tahoma",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:60px;
  }
  header.app-header{
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff;
    padding:22px 18px 26px;
    text-align:center;
    border-radius:0 0 22px 22px;
    box-shadow:0 4px 14px rgba(0,0,0,.12);
  }
  header.app-header h1{margin:0;font-size:20px;font-weight:700;}
  header.app-header p{margin:6px 0 0;font-size:13px;opacity:.9;}

  /* Login Overlay */
  .login-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 110, 92, 0.95);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 20px;
  }
  .login-card {
    background: #fff; border-radius: 16px; padding: 30px;
    max-width: 400px; width: 100%; text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  }
  .login-card h2 { color: var(--primary-dark); margin-top: 0; font-size: 20px; }
  .login-card p { font-size: 13px; color: var(--muted); margin-bottom: 20px; }

  .steps-bar{
    display:flex;justify-content:center;gap:6px;margin:16px auto 0;max-width:520px;padding:0 16px;
  }
  .steps-bar .dot{
    flex:1;height:5px;border-radius:4px;background:#e3e8e6;transition:.3s;
  }
  .steps-bar .dot.active{background:var(--accent);}
  .steps-bar .dot.done{background:var(--primary);}

  .container{max-width:640px;margin:0 auto;padding:16px;}
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px;
    margin-bottom:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.03);
  }
  .card h2{font-size:16px;margin:0 0 4px;color:var(--primary-dark);}
  .card .hint{font-size:12.5px;color:var(--muted);margin:0 0 14px;}

  label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px;color:var(--text);text-align:right;}
  input[type=text],input[type=number],input[type=email],textarea,select{
    width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;
    font-size:14px;font-family:inherit;background:#fbfdfc;color:var(--text);
  }
  textarea{resize:vertical;min-height:80px;}
  .row2{display:flex;gap:10px;}
  .row2 > div{flex:1;}

  button{
    font-family:inherit;cursor:pointer;border:none;border-radius:12px;
    font-size:14.5px;font-weight:700;padding:13px 18px;transition:.15s;
  }
  .btn-primary{background:var(--primary);color:#fff;width:100%;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-primary:disabled{background:#a9c2bc;cursor:not-allowed;}
  .btn-secondary{background:#fff;color:var(--primary);border:1.5px solid var(--primary);width:100%;}
  .btn-ghost{background:transparent;color:var(--muted);width:auto;padding:8px 10px;font-weight:600;font-size:13px;}
  .btn-row{display:flex;gap:10px;margin-top:16px;}
  .btn-row button{flex:1;}

  .action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
  .action-btn{
    background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:14px 10px;
    text-align:center;color:var(--text);font-size:13.5px;font-weight:700;
  }
  .action-btn .emoji{font-size:22px;display:block;margin-bottom:6px;}

  .loading{
    display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 10px;color:var(--muted);
  }
  .spinner{
    width:34px;height:34px;border-radius:50%;
    border:4px solid #e3e8e6;border-top-color:var(--primary);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  table.plan-table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:6px;}
  table.plan-table th, table.plan-table td{
    border:1px solid #cfd8d4;padding:6px 5px;text-align:center;vertical-align:top;line-height:1.5;
  }
  table.plan-table th{background:#eaf3ef;color:var(--primary-dark);font-weight:700;}
  table.plan-table td{background:#fff;}
  .domain-cell{background:#f5efe1 !important;font-weight:700;color:#8a6a20;}
  .meta-table{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:12.5px;}
  .meta-table td{border:1px solid #cfd8d4;padding:7px 8px;}
  .meta-table td.label{background:#eaf3ef;font-weight:700;width:110px;color:var(--primary-dark);}
  .section-title{font-weight:700;color:var(--primary-dark);font-size:14px;margin:18px 0 8px;border-right:4px solid var(--accent);padding-right:8px;}

  .qcard{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:13.5px;}
  .qcard b{color:var(--primary-dark);}
  .qcard .opt{margin:4px 0 0 4px;color:var(--text);}
  .qcard .correct{color:var(--primary);font-weight:700;}

  .badge{display:inline-block;background:#eaf3ef;color:var(--primary-dark);font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700;margin-bottom:8px;}
  .error-box{background:#fbeceb;color:var(--danger);border:1px solid #f0c9c6;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px;}
  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:#1f2b26;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;
    box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:1050;opacity:0;transition:.3s;pointer-events:none;
  }
  .toast.show{opacity:1;}
  .top-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .small-muted{font-size:12px;color:var(--muted);}

  .upload-box{
    border:2px dashed var(--border);border-radius:14px;padding:18px 12px;text-align:center;
    background:#fbfdfc;cursor:pointer;transition:.15s;
  }
  .upload-box:hover{border-color:var(--primary);}
  .upload-box .emoji{font-size:28px;display:block;margin-bottom:6px;}
  .upload-box input[type=file]{display:none;}
  .file-chip{
    display:flex;align-items:center;justify-content:space-between;
    background:#eaf3ef;border-radius:10px;padding:9px 12px;margin-top:10px;font-size:13px;color:var(--primary-dark);
  }
  .file-chip .rm{color:var(--danger);cursor:pointer;font-weight:700;}
  .divider-or{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--muted);font-size:12px;}
  .divider-or::before,.divider-or::after{content:"";flex:1;height:1px;background:var(--border);}
</style>
</head>
<body>

<!-- شاشة الدخول المخصصة لكادر الأكاديمية -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <h2>🏫 دخول الكادر التعليمي</h2>
    <p>أدخل بريدك الإلكتروني الخاص بأكاديمية الرواد الدولية للاستمرار</p>
    <div style="margin-bottom: 15px;">
      <input type="email" id="loginEmail" placeholder="username@ipa.edu.jo" dir="ltr" style="text-align: center;">
    </div>
    <div id="loginError" style="margin-bottom: 10px;"></div>
    <button class="btn-primary" onclick="validateLogin()">تسجيل الدخول</button>
  </div>
</div>

<header class="app-header">
  <h1>📘 مساعد تحضير الدروس الذكي - الرواد</h1>
  <p>توليد خطط الدروس والأنشطة تلقائيًا عبر الذكاء الاصطناعي</p>
</header>

<div class="steps-bar" id="stepsBar"></div>

<div class="container" id="app"></div>

<div class="toast" id="toast"></div>

<script>
// مفتاح API الخاص بك يتم ربطه هنا تلقائياً دون إظهاره للمستخدم
const MY_API_KEY = AQ.Ab8RN6KGVuxq-31cBEP45O68MH-cuHwEVgsHn2ReUXFswpz7nw;

const state = {
  authenticated: false,
  userEmail: "",
  step: 1,
  lesson: {
    grade:"", section:"", subject:"", unit:"", title:"",
    dateFrom:"", dateTo:"", periods:"1",
    warmup:"", priorLearning:""
  },
  book: { pages:"", content:"", fileName:"" },
  plan: null,
  questions: null,
  presentation: null,
  summary: null,
  loading: false
};

if(window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

const el = id => document.getElementById(id);

function toast(msg){
  const t = el('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}

// التحقق من البريد الإلكتروني الخاص بالأكاديمية
function validateLogin(){
  const emailInput = el('loginEmail').value.trim().toLowerCase();
  const errDiv = el('loginError');
  
  if(!emailInput.endsWith('@ipa.edu.jo')){
    errDiv.innerHTML = `<div class="error-box">عذراً، يرجى استخدام بريد إلكتروني ينتهي بـ @ipa.edu.jo</div>`;
    return;
  }

  state.authenticated = true;
  state.userEmail = emailInput;
  el('loginOverlay').style.display = 'none';
  toast('أهلاً بك في المساعد الذكي 👋');
  render();
}

function renderStepsBar(){
  const total = 3;
  let html = '';
  for(let i=1;i<=total;i++){
    let cls = 'dot';
    if(i < state.step) cls += ' done';
    if(i === state.step) cls += ' active';
    html += `<div class="${cls}"></div>`;
  }
  el('stepsBar').innerHTML = html;
}

function goStep(n){
  state.step = n;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function extractJSON(text){
  let t = text.trim();
  t = t.replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  const start = t.indexOf('{');
  const end = t.lastIndexOf('}');
  if(start === -1 || end === -1) throw new Error("تعذر تحليل الاستجابة من الخدمة");
  return JSON.parse(t.slice(start, end+1));
}

// الاتصال التلقائي بالـ API في الخلفية
async function callGeminiAPI(promptText) {
  if(!MY_API_KEY || MY_API_KEY.includes("ضع_مفتاح")){
    throw new Error("يرجى ضبط متغير MY_API_KEY في السكربت بمفتاح Google Gemini الخارجي.");
  }
  const url = `[https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$](https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$){MY_API_KEY}`;
  
  const response = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [{ text: promptText }] }]
    })
  });

  const data = await response.json();
  if (!response.ok) {
    throw new Error(data.error?.message || "حدث خطأ أثناء التواصل مع الخدمة الذكية");
  }

  const rawText = data.candidates[0].content.parts[0].text;
  return extractJSON(rawText);
}

// ---------- STEP 1: Lesson info ----------
function renderStep1(){
  const l = state.lesson;
  return `
  <div class="card">
    <h2>1️⃣ معلومات الدرس</h2>
    <p class="hint">أدخل بيانات الدرس الأساسية.</p>

    <div class="row2">
      <div>
        <label>الصف *</label>
        <input type="text" id="f_grade" placeholder="مثال: الثامن" value="${l.grade}">
      </div>
      <div>
        <label>الشعبة</label>
        <input type="text" id="f_section" placeholder="مثال: أ، ب، ج" value="${l.section}">
      </div>
    </div>

    <label>المبحث *</label>
    <input type="text" id="f_subject" placeholder="مثال: الثقافة المالية" value="${l.subject}">

    <div class="row2">
      <div>
        <label>عنوان الوحدة</label>
        <input type="text" id="f_unit" placeholder="مثال: البنوك" value="${l.unit}">
      </div>
      <div>
        <label>عدد الحصص</label>
        <input type="number" id="f_periods" min="1" value="${l.periods}">
      </div>
    </div>

    <label>عنوان الدرس *</label>
    <input type="text" id="f_title" placeholder="مثال: خيارات حفظ الأموال" value="${l.title}">

    <div class="row2">
      <div>
        <label>التاريخ من</label>
        <input type="text" id="f_dateFrom" placeholder="يوم/شهر/سنة" value="${l.dateFrom}">
      </div>
      <div>
        <label>التاريخ إلى</label>
        <input type="text" id="f_dateTo" placeholder="يوم/شهر/سنة" value="${l.dateTo}">
      </div>
    </div>

    <label>التهيئة الحافزة (اختياري)</label>
    <textarea id="f_warmup" placeholder="مثال: أين يخبئ الناس أموالهم عادةً؟">${l.warmup}</textarea>

    <label>مراجعة التعلم السابق (اختياري)</label>
    <textarea id="f_prior" placeholder="مثال: قرارات الادخار">${l.priorLearning}</textarea>

    <div class="btn-row">
      <button class="btn-primary" onclick="saveStep1AndNext()">التالي ←</button>
    </div>
  </div>`;
}

function saveStep1AndNext(){
  const l = state.lesson;
  l.grade = el('f_grade').value.trim();
  l.section = el('f_section').value.trim();
  l.subject = el('f_subject').value.trim();
  l.unit = el('f_unit').value.trim();
  l.title = el('f_title').value.trim();
  l.dateFrom = el('f_dateFrom').value.trim();
  l.dateTo = el('f_dateTo').value.trim();
  l.periods = el('f_periods').value.trim() || "1";
  l.warmup = el('f_warmup').value.trim();
  l.priorLearning = el('f_prior').value.trim();

  if(!l.grade || !l.subject || !l.title){
    toast("يرجى تعبئة الصف والمبحث وعنوان الدرس على الأقل");
    return;
  }
  goStep(2);
}

// ---------- STEP 2: Book content ----------
function renderStep2(){
  const b = state.book;
  return `
  <div class="card">
    <h2>2️⃣ محتوى الكتاب وتوليد الخطة</h2>
    <p class="hint">ارفع ملف PDF واستخرج الصفحات، أو الصق النص مباشرة للبدء بالتوليد التلقائي.</p>

    <label>نطاق الصفحات المطلوبة</label>
    <input type="text" id="f_pages" placeholder="مثال: 45-51" value="${b.pages}" oninput="state.book.pages=this.value">

    <label style="margin-top:16px">رفع ملف الكتاب (PDF)</label>
    <label class="upload-box" for="pdfInput">
      <span class="emoji">📄</span>
      <span>${b.fileName ? 'اضغط لاستبدال الملف' : 'اختيار ملف PDF من جهازك'}</span>
      <input type="file" id="pdfInput" accept="application/pdf" onchange="handlePdfUpload(event)">
    </label>
    ${b.fileName ? `<div class="file-chip"><span>📎 ${b.fileName}</span><span class="rm" onclick="clearPdf()">إزالة ✕</span></div>` : ''}

    <div id="pdfStatus"></div>

    <button class="btn-secondary" style="margin-top:12px" onclick="extractPdfPages()" ${!b.fileName ? 'disabled' : ''}>
      🔍 استخراج المحتوى من الصفحات المحددة
    </button>

    <div class="divider-or">أو النص المباشر</div>

    <label>نص محتوى الدرس</label>
    <textarea id="f_content" style="min-height:120px" placeholder="الصق نص الصفحات هنا..." oninput="state.book.content=this.value">${b.content}</textarea>

    <div id="apiError"></div>

    <div class="btn-row">
      <button class="btn-secondary" onclick="goStep(1)">→ رجوع</button>
      <button class="btn-primary" style="background:var(--accent)" onclick="generatePlanAuto()" ${state.loading ? 'disabled':''}>
        ${state.loading ? 'جارِ التوليد الذكي...' : '✨ توليد الخطة تلقائياً'}
      </button>
    </div>
  </div>`;
}

let pdfFileData = null;
function handlePdfUpload(evt){
  const file = evt.target.files[0];
  if(!file || file.type !== 'application/pdf') return;
  const reader = new FileReader();
  reader.onload = function(e){
    pdfFileData = e.target.result;
    state.book.fileName = file.name;
    render();
  };
  reader.readAsArrayBuffer(file);
}

function clearPdf(){ pdfFileData = null; state.book.fileName = ""; render(); }

async function extractPdfPages(){
  if(!pdfFileData) return;
  const pagesInput = el('f_pages').value.trim();
  el('pdfStatus').innerHTML = `<div class="loading"><div class="spinner"></div><div>جارِ استخراج النص...</div></div>`;
  try{
    const pdf = await pdfjsLib.getDocument({data: pdfFileData.slice(0)}).promise;
    let pageNumbers = Array.from({length: pdf.numPages}, (_,i)=>i+1);
    let fullText = '';
    for(const pNum of pageNumbers.slice(0, 30)){
      const page = await pdf.getPage(pNum);
      const content = await page.getTextContent();
      fullText += `\n ${content.items.map(it=>it.str).join(' ')}`;
    }
    state.book.content = fullText.trim();
    el('f_content').value = state.book.content;
    el('pdfStatus').innerHTML = `<div class="small-muted" style="margin-top:8px">✅ تم استخراج المحتوى.</div>`;
  }catch(err){
    el('pdfStatus').innerHTML = `<div class="error-box">⚠️ تعذر القراءة: ${err.message}</div>`;
  }
}

async function generatePlanAuto(){
  state.book.content = el('f_content').value.trim();
  state.loading = true;
  render();

  const l = state.lesson, b = state.book;
  const prompt = `أنت خبير في التصميم التعليمي ومطابق لنماذج وزارة التربية.
أنشئ خطة درس بصيغة JSON فقط:
الصف: ${l.grade} | المبحث: ${l.subject} | الدرس: ${l.title} | عدد الحصص: ${l.periods}
المحتوى: ${b.content || 'معارف الدرس العامة'}

البنية المطلوبة لـ JSON حصراً:
{
  "warmup": "التهيئة",
  "prior_learning": "التعلم السابق",
  "rows": [
    {
      "domain": "المعرفية أو الوجدانية أو المهارية-الأدائية",
      "bloom_level": "تذكر/فهم/تطبيق...",
      "outcome": "نتاج التعلم",
      "time_minutes": 10,
      "content": "المحتوى",
      "strategy": "استراتيجية التدريس",
      "thinking_key": "مفتاح تفكير",
      "resources": "مصادر التعلم",
      "assessment_strategy": "استراتيجية التقويم",
      "assessment_tool": "أداة التقويم"
    }
  ],
  "feedback": "التغذية الراجعة"
}`;

  try{
    const result = await callGeminiAPI(prompt);
    state.plan = result;
    state.loading = false;
    goStep(3);
  }catch(err){
    state.loading = false;
    render();
    el('apiError').innerHTML = `<div class="error-box">⚠️ فشل التوليد التلقائي: ${err.message}</div>`;
  }
}

// ---------- STEP 3: Result ----------
function renderStep3(){
  const l = state.lesson, p = state.plan;
  if(!p) return ``;

  let rows = '';
  let counter = 1;
  p.rows.forEach(r=>{
    rows += `<tr>
      <td>${counter++}</td>
      <td class="domain-cell">${r.domain}</td>
      <td><b>${r.bloom_level||''}</b><br>${r.outcome||''}</td>
      <td>${r.time_minutes||''} د</td>
      <td style="text-align:right">${r.content||''}</td>
      <td style="text-align:right">${r.strategy||''}</td>
      <td>${r.resources||''}</td>
      <td>${r.assessment_strategy||''}</td>
      <td>${r.assessment_tool||''}</td>
    </tr>`;
  });

  return `
  <div class="card">
    <div class="top-nav">
      <h2>✅ خطة الدرس المكتملة</h2>
      <button class="btn-ghost" onclick="goStep(2)">✏️ إعادة التوليد</button>
    </div>
    <table class="meta-table">
      <tr><td class="label">الصف</td><td>${l.grade}</td><td class="label">الشعبة</td><td>${l.section||'-'}</td></tr>
      <tr><td class="label">المبحث</td><td colspan="3">${l.subject}</td></tr>
      <tr><td class="label">عنوان الدرس</td><td colspan="3">${l.title}</td></tr>
    </table>

    <div style="overflow-x:auto">
    <table class="plan-table">
      <tr>
        <th>#</th><th>المجال</th><th>النتاج ومستوى بلوم</th><th>الزمن</th><th>المحتوى</th>
        <th>الاستراتيجية</th><th>المصادر</th><th>التقويم</th><th>الأداة</th>
      </tr>
      ${rows}
    </table>
    </div>

    <button class="btn-secondary" style="margin-top:14px" onclick="downloadPlanWord()">⬇️ تحميل الخطة (Word)</button>
  </div>`;
}

function downloadPlanWord(){
  const l = state.lesson, p = state.plan;
  let rowsHtml = p.rows.map((r,i)=>`
    <tr>
      <td>${i+1}</td><td>${r.domain}</td><td>${r.bloom_level}: ${r.outcome}</td>
      <td>${r.time_minutes} د</td><td>${r.content}</td><td>${r.strategy}</td>
      <td>${r.resources}</td><td>${r.assessment_strategy}</td><td>${r.assessment_tool}</td>
    </tr>
  `).join('');

  const body = `
    <h1>خطة درس: ${l.title}</h1>
    <p><b>الصف:</b> ${l.grade} | <b>المبحث:</b> ${l.subject}</p>
    <table border="1">
      <tr><th>#</th><th>المجال</th><th>النتاج</th><th>الزمن</th><th>المحتوى</th><th>الاستراتيجية</th><th>المصادر</th><th>التقويم</th><th>الأداة</th></tr>
      ${rowsHtml}
    </table>
  `;
  const blob = new Blob(['\ufeff', body], {type:'application/msword'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `تحضير_${l.title}.doc`;
  a.click();
}

function render(){
  renderStepsBar();
  let html = '';
  if(state.step===1) html = renderStep1();
  else if(state.step===2) html = renderStep2();
  else if(state.step===3) html = renderStep3();
  el('app').innerHTML = html;
}

render();
</script>
</body>
</html>
